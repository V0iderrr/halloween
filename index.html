<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boo? 🎃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #070707;
    --bg-glow-1: #e11d2e;
    --bg-glow-2: #7a0d16;
    --surface: rgba(20, 9, 10, 0.55);
    --surface-2: rgba(32, 13, 14, 0.5);
    --surface-3: rgba(44, 17, 18, 0.55);
    --border: rgba(225, 29, 46, 0.28);
    --border-soft: rgba(225, 29, 46, 0.16);
    --text: #f5eaea;
    --text-muted: #b39496;
    --text-faint: #7d6264;
    --accent: #ef233c;
    --accent-2: #7a0d16;
    --accent-ink: #fff5f5;
    --danger: #ff8080;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-head: "Space Grotesk", "Inter", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 28px 18px;
    position: relative;
    overflow-x: hidden;
  }

  /* ambient glow */
  body::before, body::after{
    content: "";
    position: fixed;
    width: 46vmax;
    height: 46vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    z-index: 0;
    pointer-events: none;
    animation: drift 16s ease-in-out infinite alternate;
  }
  body::before{
    background: var(--bg-glow-1);
    top: -18vmax;
    left: -14vmax;
  }
  body::after{
    background: var(--bg-glow-2);
    bottom: -20vmax;
    right: -16vmax;
    animation-delay: -8s;
  }

  @keyframes drift{
    from{ transform: translate(0,0) scale(1); }
    to{ transform: translate(4%, 3%) scale(1.08); }
  }

  .stage{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 38px 30px 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.75), 0 0 80px -30px rgba(225,29,46,0.35);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
  }

  .card::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }

  .cobweb{
    position: absolute;
    width: 92px;
    height: 92px;
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
    color: var(--accent);
  }
  .cobweb.top-left{ top: -12px; left: -12px; }
  .cobweb.bottom-right{ bottom: -12px; right: -12px; transform: rotate(180deg); }

  .panel{ display: none; }
  .panel.visible{
    display: block;
    animation: rise 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  h1{
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.7rem;
    line-height: 1.25;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }

  .subtitle{
    color: var(--text-muted);
    font-size: 0.98rem;
    line-height: 1.55;
    margin: 0 0 26px;
    position: relative;
    z-index: 1;
  }

  .hint{
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 13px 15px;
    margin-bottom: 22px;
    font-size: 0.9rem;
    color: var(--text-muted);
    position: relative;
    z-index: 1;
  }
  .hint .dot{
    flex: none;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-2);
    margin-top: 7px;
  }

  label.field-label{
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  input[type="text"], input[type="password"], textarea{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    outline: none;
    transition: border-color .18s ease, background .18s ease;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus{
    border-color: var(--accent);
    background: var(--surface-3);
  }
  input::placeholder, textarea::placeholder{ color: var(--text-faint); }

  .pw-row{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }

  .shake{ animation: shake .38s ease; }
  @keyframes shake{
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  .error-msg{
    color: var(--danger);
    font-size: 0.88rem;
    min-height: 18px;
    margin: 10px 2px 0;
    font-weight: 500;
    position: relative;
    z-index: 1;
  }

  .btn{
    appearance: none;
    border: none;
    cursor: pointer;
    width: 100%;
    padding: 15px 18px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.02rem;
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
    box-shadow: 0 12px 28px -12px rgba(239,35,60,0.45);
    position: relative;
    z-index: 1;
  }
  .btn:hover{ filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0px) scale(0.99); }
  .btn:focus-visible{ outline: 2px solid var(--accent-2); outline-offset: 3px; }
  .btn:disabled{ opacity: 0.7; cursor: default; transform: none; }

  fieldset{
    border: none;
    padding: 0;
    margin: 0 0 22px;
    position: relative;
    z-index: 1;
  }
  legend{
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 10px;
    padding: 0;
  }

  .chip-group{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip-input{
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  .chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: all .16s ease;
    white-space: nowrap;
  }
  .chip:hover{ border-color: var(--accent); color: var(--text); }
  .chip-input:checked + .chip{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 8px 18px -8px rgba(239,35,60,0.55);
  }
  .chip-input:focus-visible + .chip{
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .field-block{ margin-bottom: 22px; position: relative; z-index: 1; }

  /* Boo yes/no block */
  .boo-block{
    margin-bottom: 26px;
    position: relative;
    z-index: 1;
  }
  .boo-buttons{
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    padding: 10px 0 4px;
  }
  .boo-btn{
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1rem;
    padding: 13px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.3,1.4,.4,1), background .18s ease, border-color .18s ease;
  }
  .boo-yes{
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-ink);
    border-color: transparent;
    transform-origin: center;
  }
  .boo-yes:hover{ filter: brightness(1.08); }
  .boo-no:hover{ border-color: var(--accent); }
  .boo-btn:focus-visible{ outline: 2px solid var(--accent-2); outline-offset: 3px; }
  .boo-teaser{
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    min-height: 20px;
    margin: 10px 0 0;
  }

  .theme-other{ margin-top: 14px; }

  .summary-box{
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 18px 18px 16px;
    margin: 4px 0 4px;
    position: relative;
    z-index: 1;
  }
  .summary-row{
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .summary-row:last-child{ border-bottom: none; }
  .summary-row .k{
    font-size: 0.78rem;
    color: var(--text-faint);
    font-weight: 500;
  }
  .summary-row .v{
    font-size: 0.99rem;
    color: var(--text);
    line-height: 1.5;
  }

  .confirm-note{
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 18px 0 4px;
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }

  .contact-block{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: flex-end;
    position: relative;
    z-index: 1;
  }
  .contact-pill{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 15px;
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.6;
    text-align: right;
  }
  .contact-pill a{
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .contact-pill a:hover{ color: var(--accent-2); }

  .sound-control{
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 24px -14px rgba(0,0,0,0.65);
  }

  .volume-slider{
    -webkit-appearance: none;
    appearance: none;
    width: 84px;
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--accent-ink);
    box-shadow: 0 2px 6px rgba(239,35,60,0.5);
    cursor: pointer;
  }
  .volume-slider::-moz-range-thumb{
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--accent-ink);
    box-shadow: 0 2px 6px rgba(239,35,60,0.5);
    cursor: pointer;
  }
  .volume-slider::-moz-range-track{
    height: 4px;
    border-radius: 999px;
    background: var(--border);
  }
  .volume-slider:focus-visible{
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
  }

  .sound-toggle{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-3);
    color: var(--text);
    font-size: 1.05rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    flex: none;
    transition: border-color .16s ease, transform .16s ease, background .16s ease;
  }
  .sound-toggle:hover{ border-color: var(--accent); }
  .sound-toggle:active{ transform: scale(0.94); }
  .sound-toggle:focus-visible{ outline: 2px solid var(--accent-2); outline-offset: 3px; }

  @media (max-width: 420px){
    .card{ padding: 30px 20px 24px; border-radius: 18px; }
    h1{ font-size: 1.45rem; }
    .contact-block{ justify-content: center; }
    .contact-pill{ text-align: center; width: 100%; }
    .sound-control{ padding: 5px 6px 5px 12px; gap: 8px; }
    .volume-slider{ width: 62px; }
    .boo-buttons{ gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<audio id="bgMusic" src="halloween.mp3" loop preload="auto"></audio>
<div class="sound-control">
  <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="10" step="1" aria-label="Hangerő" title="Hangerő">
  <button type="button" id="soundToggle" class="sound-toggle" aria-label="Zene némítása vagy lejátszása" aria-pressed="false" title="Zene ki/be">🔇</button>
</div>

<div class="stage">
  <div class="card">
    <svg class="cobweb top-left" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <path d="M0 0 L100 100 M20 0 L100 80 M40 0 L100 60 M60 0 L100 40 M80 0 L100 20 M0 20 L80 100 M0 40 L60 100 M0 60 L40 100 M0 80 L20 100"/>
        <path d="M0 0 Q50 8 100 0 M0 0 Q8 50 0 100 M0 0 Q55 55 100 100"/>
      </g>
    </svg>
    <svg class="cobweb bottom-right" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <path d="M0 0 L100 100 M20 0 L100 80 M40 0 L100 60 M60 0 L100 40 M80 0 L100 20 M0 20 L80 100 M0 40 L60 100 M0 60 L40 100 M0 80 L20 100"/>
        <path d="M0 0 Q50 8 100 0 M0 0 Q8 50 0 100 M0 0 Q55 55 100 100"/>
      </g>
    </svg>

    <!-- SCREEN 1 — PASSWORD -->
    <section class="panel visible" id="screen-login">
      <h1>Salutation m'lady🎃</h1>
      <div class="hint">
        <span class="dot"></span>
        <span>Mi a film címe, amit múltkor Wikipédiáról olvastál fel nekem? (🩸)</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="pw-row">
          <label class="field-label" for="pwInput">Jelszó</label>
          <input type="password" id="pwInput" name="password" placeholder="Jelszó..." autocomplete="off">
        </div>
        <p class="error-msg" id="pwError" aria-live="polite"></p>
        <button type="submit" class="btn">Belépés</button>
      </form>
    </section>

    <!-- SCREEN 2 — INVITE -->
    <section class="panel" id="screen-invite">
      <h1>Will you be my boo? 🧛</h1>
      <p class="subtitle">Október 31. — Halloween 🎃</p>

      <form id="inviteForm" novalidate>

        <input type="hidden" name="access_key" value="82b6a5ea-cec1-45c0-a122-553bdbaa1f15">
        <input type="hidden" name="subject" value="Új Halloween-i válasz érkezett! 🎃🦇">
        <input type="hidden" name="from_name" value="Halloweeni meghívó">

        <div class="boo-block" id="booBlock">
          <div class="boo-buttons">
            <button type="button" id="booYesBtn" class="boo-btn boo-yes">Yeahh 😇</button>
            <button type="button" id="booNoBtn" class="boo-btn boo-no">Hell no 🙅</button>
          </div>
          <p class="boo-teaser" id="booTeaser">&nbsp;</p>
          <input type="hidden" name="BooValasz" id="booAnswer" value="">
          <p class="error-msg" id="booError" aria-live="polite"></p>
        </div>

        <fieldset id="themeFieldset">
          <legend>Vibe?</legend>
          <div class="chip-group">
            <input class="chip-input" type="radio" name="Theme" id="t1" value="Vámpírok 🧛🩸">
            <label class="chip" for="t1">Vámpírok 🧛🩸</label>

            <input class="chip-input" type="radio" name="Theme" id="t2" value="Obsession">
            <label class="chip" for="t2">Obsession ☹️🧱</label>

            <input class="chip-input" type="radio" name="Theme" id="t3" value="Más">
            <label class="chip" for="t3">Más</label>
          </div>
          <div class="field-block theme-other" id="themeOtherWrap" style="display:none;">
            <label class="field-label" for="themeOtherInput">Mi legyen helyette?</label>
            <input type="text" id="themeOtherInput" name="Theme_Mas" placeholder="Írd ide...">
          </div>
          <p class="error-msg" id="themeError" aria-live="polite"></p>
        </fieldset>

        <button type="submit" class="btn" id="submitBtn">Küldés! 🦇</button>
        <p class="error-msg" id="formError" aria-live="polite"></p>
      </form>
    </section>

    <!-- SCREEN 3 — CONFIRMATION -->
    <section class="panel" id="screen-confirm">
      <h1>Good boo 👻</h1>
      <p class="confirm-note">Foglalás megtörtént, a felmerülő problémákról konzultáljon velem!</p>

      <div class="summary-box">
        <div class="summary-row">
          <span class="k">Válasz</span>
          <span class="v" id="sumAnswer">—</span>
        </div>
        <div class="summary-row">
          <span class="k">Téma</span>
          <span class="v" id="sumTheme">—</span>
        </div>
      </div>

      <div class="contact-block">
        <div class="contact-pill">
          <a href="mailto:gergobodnar754@gmail.com">gergobodnar754@gmail.com</a><br>
          <a href="tel:+36309686577">06309686577</a>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
  (function(){
    const screens = {
      login: document.getElementById('screen-login'),
      invite: document.getElementById('screen-invite'),
      confirm: document.getElementById('screen-confirm')
    };

    function showScreen(name){
      Object.values(screens).forEach(s => s.classList.remove('visible'));
      screens[name].classList.add('visible');
    }

    function normalize(str){
      return str
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    // --- Háttérzene / mute gomb / hangerő csúszka ---
    const bgMusic = document.getElementById('bgMusic');
    const soundToggle = document.getElementById('soundToggle');
    const volumeSlider = document.getElementById('volumeSlider');

    bgMusic.volume = 0.1;

    function updateVolumeFill(){
      const v = volumeSlider.value;
      volumeSlider.style.background =
        `linear-gradient(to right, var(--accent) ${v}%, var(--border) ${v}%)`;
    }
    updateVolumeFill();

    volumeSlider.addEventListener('input', function(){
      bgMusic.volume = volumeSlider.value / 100;
      updateVolumeFill();
    });

    function updateSoundIcon(){
      const playing = !bgMusic.paused;
      soundToggle.textContent = playing ? '🔊' : '🔇';
      soundToggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
    }
    bgMusic.addEventListener('play', updateSoundIcon);
    bgMusic.addEventListener('pause', updateSoundIcon);

    soundToggle.addEventListener('click', function(){
      if(bgMusic.paused){
        bgMusic.play().catch(function(){ /* böngésző letiltotta, semmi gond */ });
      } else {
        bgMusic.pause();
      }
    });

    // --- Login ---
    const loginForm = document.getElementById('loginForm');
    const pwInput = document.getElementById('pwInput');
    const pwError = document.getElementById('pwError');
    const pwRow = document.querySelector('.pw-row');

    loginForm.addEventListener('submit', function(e){
      e.preventDefault();
      const val = normalize(pwInput.value);
      if(val === 'nosferatu'){
        pwError.textContent = '';
        showScreen('invite');
        bgMusic.play().catch(function(){ /* böngésző letiltotta, semmi gond */ });
      } else {
        pwError.textContent = 'Helytelen jelszó, próbáld újra!';
        pwRow.classList.remove('shake');
        void pwRow.offsetWidth;
        pwRow.classList.add('shake');
        pwInput.value = '';
        pwInput.focus();
      }
    });

    // --- Boo yes/no mechanika ---
    const booYesBtn = document.getElementById('booYesBtn');
    const booNoBtn = document.getElementById('booNoBtn');
    const booTeaser = document.getElementById('booTeaser');
    const booAnswer = document.getElementById('booAnswer');
    const booError = document.getElementById('booError');
    const booBlock = document.getElementById('booBlock');

    let noClicks = 0;
    const teaserLines = [
      'Na mi lesz? 👀',
      'Biztos ezt akarod? 🙄',
      'Gondold át még egyszer... 🥺',
      'Utolsó esély! 😤',
      'Oké, te akartad. 😈'
    ];

    booNoBtn.addEventListener('click', function(){
      noClicks++;
      booAnswer.value = 'Nem';
      booError.textContent = '';
      const growScale = Math.min(1 + noClicks * 0.18, 2.1);
      const shrinkScale = Math.max(1 - noClicks * 0.08, 0.55);
      booYesBtn.style.transform = `scale(${growScale})`;
      booNoBtn.style.transform = `scale(${shrinkScale})`;
      booTeaser.textContent = teaserLines[Math.min(noClicks - 1, teaserLines.length - 1)];
    });

    booYesBtn.addEventListener('click', function(){
      booAnswer.value = 'Igen';
      booError.textContent = '';
      booTeaser.textContent = 'Tudtam! 🖤';
    });

    // --- Theme "Más" mező megjelenítése ---
    const themeOtherWrap = document.getElementById('themeOtherWrap');
    const themeOtherInput = document.getElementById('themeOtherInput');
    const themeFieldset = document.getElementById('themeFieldset');
    const themeError = document.getElementById('themeError');

    function updateThemeOtherVisibility(){
      const checked = document.querySelector('input[name="Theme"]:checked');
      themeOtherWrap.style.display = (checked && checked.value === 'Más') ? 'block' : 'none';
    }
    document.querySelectorAll('input[name="Theme"]').forEach(function(r){
      r.addEventListener('change', updateThemeOtherVisibility);
    });

    // --- Invite / Web3Forms submit ---
    const inviteForm = document.getElementById('inviteForm');
    const formError = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnDefaultText = submitBtn.textContent;

    inviteForm.addEventListener('submit', async function(e){
      e.preventDefault();

      if(!booAnswer.value){
        booError.textContent = 'Válaszolj a kérdésre, mielőtt elküldöd! 👻';
        booBlock.classList.remove('shake');
        void booBlock.offsetWidth;
        booBlock.classList.add('shake');
        return;
      }
      booError.textContent = '';

      const themeChecked = document.querySelector('input[name="Theme"]:checked');
      if(!themeChecked){
        themeError.textContent = 'Válassz egy témát, hogy tudjam mire készüljek! 🕸️';
        themeFieldset.classList.remove('shake');
        void themeFieldset.offsetWidth;
        themeFieldset.classList.add('shake');
        return;
      }
      if(themeChecked.value === 'Más' && !themeOtherInput.value.trim()){
        themeError.textContent = 'Írd be, mi legyen a téma! 🕯️';
        themeFieldset.classList.remove('shake');
        void themeFieldset.offsetWidth;
        themeFieldset.classList.add('shake');
        return;
      }
      themeError.textContent = '';
      formError.textContent = '';

      const themeText = themeChecked.value === 'Más' ? themeOtherInput.value.trim() : themeChecked.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Küldés...';

      try {
        const formData = new FormData(inviteForm);
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: formData
        });
        const result = await response.json();

        if(result.success){
          document.getElementById('sumAnswer').textContent = booAnswer.value;
          document.getElementById('sumTheme').textContent = themeText;
          showScreen('confirm');
        } else {
          formError.textContent = 'Hoppá, nem sikerült elküldeni. Próbáld meg újra! 🙈';
        }
      } catch(err){
        formError.textContent = 'Nincs internetkapcsolat, vagy hiba történt. Próbáld meg újra!';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = submitBtnDefaultText;
      }
    });
  })();
</script>

</body>
</html>
